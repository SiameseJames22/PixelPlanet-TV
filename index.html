<!DOCTYPE html>
<html lang="en">
<head>
    <!-- FORCED AUTH STYLES TO FIX SQUASHED LAYOUT -->
    <style>
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem 2rem;
            width: 100%;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex !important;
            flex-direction: column !important; /* Forces vertical stacking */
            gap: 1.5rem;
        }
        .auth-form {
            display: flex !important;
            flex-direction: column !important; /* Forces inputs to stack */
            gap: 1.25rem;
        }
        .social-login {
            display: flex !important;
            flex-direction: column !important; /* Forces buttons to stack */
            gap: 0.75rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #a0a0b0;
            font-size: 0.85rem;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper i {
            position: absolute;
            left: 1rem;
            color: #a0a0b0;
        }
        .input-wrapper input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            background: #252530;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }
        .btn-primary {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-social {
            background: #252530;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.75rem;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .auth-footer {
            text-align: center;
            font-size: 0.85rem;
            color: #a0a0b0;
        }
        .accent-link {
            color: #6c5ce7;
            cursor: pointer;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPlanet TV - Stream Your World</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-mode">
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo-container">
            <h1 class="brand-logo">PixelPlanet <span>TV</span></h1>
        </div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Browse</a></li>
            <li><a href="#">My List</a></li>
            <li><a href="#">Support</a></li>
        </ul>
        <button class="btn-primary pill-btn" id="navSignInBtn">Sign In</button>
    </nav>

    <!-- Main Authentication Container -->
   <div class="auth-wrapper">
    <div class="auth-card">
        <div class="card-header">
            <h1 class="brand-logo-large">PixelPlanet TV</h1>
            <p id="authSubtitle">Welcome back!</p>
        </div>

        <form id="authForm" class="auth-form">
            <!-- Username (Sign Up Only) -->
            <div class="input-group signup-only" style="display: none;">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="Choose a username">
                </div>
                <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.4rem;">We will never ask for your real name!</p>
            </div>

            <!-- Email (Both) -->
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
            </div>

            <!-- Password (Both) -->
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fa-solid fa-eye eye-icon" id="togglePassword"></i>
                </div>
            </div>

            <!-- Confirm Password (Sign Up Only) -->
            <div class="input-group signup-only" style="display: none;">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password">
                </div>
            </div>

            <!-- Remember Me / Forgot Password (Login Only) -->
            <div class="auth-options login-only">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe"> Remember Me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" id="submitBtn" class="btn-primary full-width" style="padding: 0.85rem; background: var(--accent-color); border: none; border-radius: 5px; color: white; cursor: pointer; font-weight: bold; margin-top: 10px;">Sign In</button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="social-login">
            <button class="btn-social">
                <i class="fa-brands fa-google" style="color: #ea4335;"></i> Continue with Google
            </button>
            <button class="btn-social">
                <i class="fa-brands fa-discord" style="color: #5865F2;"></i> Continue with Discord
            </button>
        </div>

        <!-- Keep this exact formatting on one line for the JS to work properly -->
        <div class="auth-footer" id="toggleText">Don't have an account? <span class="accent-link" id="toggleAuthMode">Sign Up</span></div>
    </div>
</div>

                <!-- Profile Picture (Hidden on Login) -->
                <div class="input-group signup-only" style="display: none;">
                    <label for="profilePic">Profile Picture</label>
                    <div class="input-wrapper file-wrapper">
                        <i class="fa-solid fa-image"></i>
                        <input type="file" id="profilePic" accept="image/png, image/jpeg">
                    </div>
                </div>

                <!-- Extra Options -->
                <div class="auth-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe"> Remember Me
                    </label>

                <button type="submit" class="btn-primary full-width" id="submitBtn">Sign In</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <!-- Social Logins -->
            <div class="social-login">
                <button class="btn-social">
                    <i class="fa-brands fa-google" style="color: #ea4335;"></i> Continue with Google
                </button>
                <button class="btn-social">
                    <i class="fa-brands fa-discord" style="color: #5865F2;"></i> Continue with Discord
                </button>
            </div>

            <!-- Toggle Auth State -->
            <div class="auth-footer">
                <p id="toggleText">Don't have an account? <span class="accent-link" id="toggleAuthMode">Sign Up</span></p>
            </div>
        </div>
    </main>
    

<script src="js/nav.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
