<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPlanet TV - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #0f0f16; 
            color: white; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
        }

        /* Fixed Navbar */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            background: transparent;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 3rem; /* Spaces logo from links */
        }
        .nav-left h2 { color: white; font-weight: bold; }
        .nav-links {
            display: flex;
            gap: 1.5rem; /* Spaces out the tabs */
        }
        .nav-links a {
            color: #a0a0b0;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: white; }

        /* Auth Card Layout */
        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #a0a0b0;
            font-size: 0.85rem;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper i.fa-solid:not(.eye-icon) {
            position: absolute;
            left: 1rem;
            color: #a0a0b0;
        }
        .input-wrapper input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            background: #252530;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .input-wrapper input:focus {
            border-color: #6c5ce7;
        }
        .eye-icon {
            position: absolute;
            right: 1rem;
            color: #a0a0b0;
            cursor: pointer;
        }
        
        /* Buttons */
        .btn-primary {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #5a4bcf; }
        
        .social-login {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .btn-social {
            background: #252530;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.85rem;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn-social:hover { background: #2f2f3d; }

        /* Extras */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #a0a0b0;
            font-size: 0.75rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .divider span { padding: 0 10px; }
        
        .auth-footer {
            text-align: center;
            font-size: 0.9rem;
            color: #a0a0b0;
        }
        .accent-link {
            color: #6c5ce7;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Fixed Navbar -->
    <nav class="topbar">
        <div class="nav-left">
            <h2>PixelPlanet TV</h2>
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">Browse</a>
                <a href="#">My List</a>
                <a href="#">Support</a>
            </div>
        </div>
    </nav>

    <!-- Cleaned up Auth Wrapper -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center;">
                <h1 style="margin-bottom: 5px; font-size: 1.8rem;">PixelPlanet TV</h1>
                <p id="authSubtitle" style="color: #a0a0b0; font-size: 0.9rem;">Welcome back!</p>
            </div>

            <form id="authForm" class="auth-form">
                <!-- Username (Hidden by default) -->
                <div class="input-group signup-only" style="display: none;">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" placeholder="Choose a username">
                    </div>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <i class="fa-solid fa-eye eye-icon" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">Sign In</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-login">
                <button class="btn-social">
                    <i class="fa-brands fa-google" style="color: #ea4335;"></i> Continue with Google
                </button>
                <button class="btn-social">
                    <i class="fa-brands fa-discord" style="color: #5865F2;"></i> Continue with Discord
                </button>
            </div>

            <div class="auth-footer" id="toggleText">
                Don't have an account? <span class="accent-link" id="toggleAuthMode">Sign Up</span>
            </div>
        </div>
    </div>

    <!-- Script that makes it all work -->
   <script type="module" src="js/auth.js"></script>
</body>
</html>
